name: Build, Test, Tag, and Deploy

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Next.js app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Debug NEXT_PUBLIC_SUPABASE_URL
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL length: ${{ env.NEXT_PUBLIC_SUPABASE_URL && env.NEXT_PUBLIC_SUPABASE_URL.length || 0 }}"

      - name: Debug NEXT_PUBLIC_SUPABASE_ANON_KEY
        run: |
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY length: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY && secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY.length || 0 }}"

      - name: Check if NEXT_PUBLIC_SUPABASE_URL exist
        run: |
          if [ -z "${{ env.NEXT_PUBLIC_SUPABASE_URL }}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_URL is empty!"
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_URL is set."
          fi

      - name: Check if NEXT_PUBLIC_SUPABASE_ANON_KEY exist
        run: |
          if [ -z "${{ env.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" ]; then
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY is empty!"
            exit 1
          else
            echo "NEXT_PUBLIC_SUPABASE_ANON_KEY is set."
          fi

      - name: Check env vars
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}"
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}"
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}"

      - name: Create .env file
        run: |
          echo "NEXT_PUBLIC_SUPABASE_URL=${{ env.NEXT_PUBLIC_SUPABASE_URL }}" >> .env
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}" >> .env
          echo "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" >> .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env

      - name: Install dependencies
        run: npm install

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ env.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      # Persist node_modules and .next folder to be used in next jobs
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: |
            node_modules
            .next

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download build artifacts
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: nextjs-build
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      # Since node_modules are restored from artifact, no need to reinstall
      - name: Run tests
        run: npm test

  tag:
    name: Generate and Push CalVer Tag
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code with fetch tags
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Fetch all tags

      - name: Generate CalVer tag
        id: calver
        run: |
          DATE_TAG=$(date -u +'%Y.%m.%d')
          EXISTING_TAGS=$(git tag --list "${DATE_TAG}*")

          if [ -z "$EXISTING_TAGS" ]; then
            NEW_TAG=$DATE_TAG
          else
            MAX_SUFFIX=0
            for tag in $EXISTING_TAGS; do
              SUFFIX=$(echo $tag | sed -E "s/^${DATE_TAG}\.?([0-9]*)$/\1/")
              SUFFIX=${SUFFIX:-0}
              if [ "$SUFFIX" -gt "$MAX_SUFFIX" ]; then
                MAX_SUFFIX=$SUFFIX
              fi
            done
            NEW_TAG="${DATE_TAG}.$((MAX_SUFFIX + 1))"
          fi

          echo "New tag will be: $NEW_TAG"
          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT

      - name: Create and push tag
        env:
          TAG: ${{ steps.calver.outputs.tag }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

  deploy:
    name: Deploy Application
    runs-on: ubuntu-latest
    needs: tag
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Download build artifacts
      - name: Download build artifacts
        uses: actions/download-artifact@v5
        with:
          name: nextjs-build
          path: .

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18'

      - name: Deploy application
        run: |
          echo "Deploying app..."
          echo "Deployment complete."
